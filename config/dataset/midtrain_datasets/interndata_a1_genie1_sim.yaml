# InternData-A1, genie1 sim tree (robot_type "Genie-1", LeRobot v3.0, 30 fps).
#
# 517 repo_ids, one per <task>/<object>; nesting depth varies because the
# basic_tasks archives hold a single dataset while the pick_and_place ones hold many.
# Every repo_id was checked to declare the same feature set at the same shapes.
#
# The eef slots are filled from tcp_to_robot -- the grasp point, in the robot root
# frame -- not ee_to_robot. TCP sits a rigid 220.0 mm along the tool's local +Z from
# EE with an identical orientation, so the two differ by a constant; TCP is used
# because it is where contact happens. The real tree's FK pass has to add that same
# offset to the flange pose it computes, or the two trees will disagree by 220 mm.
#
# The repo_ids list is every path under root holding a meta/info.json; regenerate it
# by walking the tree if more of it is extracted.
train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      images.rgb.head: img_1
      images.rgb.hand_left: img_2
      images.rgb.hand_right: img_3
      states.left_tcp_to_robot_pose: left_eef_state
      states.left_gripper.position: left_grip_state
      states.right_tcp_to_robot_pose: right_eef_state
      states.right_gripper.position: right_grip_state
      actions.left_tcp_to_robot_pose: left_eef_action
      actions.left_gripper.position: left_grip_action
      actions.right_tcp_to_robot_pose: right_eef_action
      actions.right_gripper.position: right_grip_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateInternDataA1Genie1
    state_len: ${num_frames}
    key_mapper:
      - ("left_eef_state", "left_grip_state", "right_eef_state", "right_grip_state"): state
  - type: GetActionInternDataA1Genie1
    action_len: ${action_len}
    key_mapper:
      - ("left_eef_action", "left_grip_action", "right_eef_action", "right_grip_action"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the tabletop manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the tabletop manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      images.rgb.head: img_1
      images.rgb.hand_left: img_2
      images.rgb.hand_right: img_3
      states.left_tcp_to_robot_pose: left_eef_state
      states.left_gripper.position: left_grip_state
      states.right_tcp_to_robot_pose: right_eef_state
      states.right_gripper.position: right_grip_state
      actions.left_tcp_to_robot_pose: left_eef_action
      actions.left_gripper.position: left_grip_action
      actions.right_tcp_to_robot_pose: right_eef_action
      actions.right_gripper.position: right_grip_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateInternDataA1Genie1
    state_len: ${num_frames}
    key_mapper:
      - ("left_eef_state", "left_grip_state", "right_eef_state", "right_grip_state"): state
  - type: GetActionInternDataA1Genie1
    action_len: ${action_len}
    key_mapper:
      - ("left_eef_action", "left_grip_action", "right_eef_action", "right_grip_action"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the tabletop manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the tabletop manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
