# HiFi-UMI-2K -- /path/to/root/dir
#
# LeRobot v3.0, robot_type simpleai_umi_4.0, recorded at 25 Hz. 398 shards laid out as
# chunk-{0000..0397}/part-0000, 482,060 episodes and 192.3M frames (2,137 hours), 15 TB on
# disk. All 398 report an identical feature signature, so FillMissingViews is not needed.
#
# chunk-0273..0397 landed after this file was first written and add 146,645 episodes /
# 58.9M frames to the 273 it originally listed -- a 44% increase. They were checked before
# being added: all 398 shard dirs carry part-0000/_SUCCESS plus meta/stats.json and
# meta/tasks.parquet, and info.json for chunk-0000/0272/0273/0300/0397 agrees on
# robot_type, fps, codebase_version and the whole feature dict, so the column map below
# needs no per-shard special case.
#
# `observation.state` and `action` are the same 20-wide layout, RIGHT ARM FIRST
# (meta/info.json: state_layout.order == ["right", "left"]):
#
#    slice      width  contents
#    [ 0: 3]      3    right eef xyz
#    [ 3: 9]      6    right eef rotation, 6D  (rotation_6d_layout: first_two_rows)
#    [ 9:10]      1    right gripper angle, radians
#    [10:13]      3    left  eef xyz
#    [13:19]      6    left  eef rotation, 6D
#    [19:20]      1    left  gripper angle, radians
#
# So GetStateHiFiUMI / GetActionHiFiUMI do two things the other writers do not: convert
# rot6d -> quaternion for the shared layout's xyz+quat eef slots (9 source dims -> 7, a
# width change a column map cannot express, which is why each spells out its own
# __call__), and undo the right-then-left ordering -- that one costs no code, since
# HIFI_UMI_SOURCE_COLS names columns per slot and resolve_source_cols emits them in
# SLOT_OFFSETS order. The rot6d convention comes from rotation_6d_to_matrix in
# primesim/utils/rotation_utils.py, which stacks with dim=-2, i.e. reads the first two
# ROWS -- matching rotation_6d_layout above. The columns reading is the transpose and so
# the inverse rotation, and nothing downstream would distinguish the two.
#
# Wired into the mix as `midtrain_datasets/hifi_umi_2k@hifi_umi_2k` in midtrain.yaml.
#
# action_layout.type is absolute_next_state_target -- action rows are
# [state_1, state_2, ..., state_last, state_last] (single-frame episodes use state_0).
# So ToRelativeAction below is correct as written: the action is an absolute pose in the
# same frame and units as the state, one step ahead.
#
# observation.state_valid / action_valid (bool[20]) mark per-dimension validity, and
# state_layout.invalid_policy is carry_forward_state_with_observation.state_valid_false
# -- an invalid frame repeats the previous pose rather than storing a sentinel, so bad
# frames are stale, not detectably wrong. Folding them in is opt-in and off below: add
# `valid_source: action_valid` to GetActionHiFiUMI (and the feature to RefactorLerobot's
# key_mapper, so the datamodule requests the column) once the false-flag rate is known
# to be worth the extra column.
#
# Cameras -- 6 streams, all 3x512x640. Three are wired in:
#   img_1  observation.images.head_main       egocentric overview, both grippers in frame
#   img_2  observation.images.left_hand_up    left wrist
#   img_3  observation.images.right_hand_up   right wrist
# Unused: head_main_stereo_right, and left/right_hand_down.

train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.head_main: img_1
      observation.images.left_hand_up: img_2
      observation.images.right_hand_up: img_3
      observation.state: eef_state
      action: eef_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateHiFiUMI
    state_len: ${num_frames}
    key_mapper:
      - ("eef_state"): state
  - type: GetActionHiFiUMI
    action_len: ${action_len}
    key_mapper:
      - ("eef_action"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]

valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.head_main: img_1
      observation.images.left_hand_up: img_2
      observation.images.right_hand_up: img_3
      observation.state: eef_state
      action: eef_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateHiFiUMI
    state_len: ${num_frames}
    key_mapper:
      - ("eef_state"): state
  - type: GetActionHiFiUMI
    action_len: ${action_len}
    key_mapper:
      - ("eef_action"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]

dataset:
  type: OpenLeRobotMixedDatasetV3
  root: /path/to/root/dir
  train_pipeline: ${..train_pipeline}
  valid_pipeline: ${..valid_pipeline}
  action_sources:
    - action
  action_from_state: false
  # Recorded at 25 Hz, so the sampling grid must be 25 or an exact integer subsample of
  # it: lerobot resolves the parquet columns against a 1e-4 tolerance and raises rather
  # than interpolating, and the 10/15 fps the launch configs use are not multiples of
  # 0.04 s. 12.5 (every 2nd frame) is the exact subsample nearest that 10-15 range, so
  # a window of ${num_frames} spans a comparable stretch of real time to the rest of the
  # mix. Change this only to 25.0 or 12.5 unless the recording rate changes.
  fps: 12.5
  repo_ids:
    - chunk-0000/part-0000
    - chunk-0001/part-0000
