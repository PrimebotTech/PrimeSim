# InternData-A1 franka, TCP=95 mm subset (robot_type "Franka", 30 fps), task group articulation_tasks.
#
# SINGLE ARM: the right eef/gripper sources are `None` so those slots stay unfilled (same
# idiom as galaxea_openworld.yaml). The arm occupies the LEFT slots, matching droid.yaml.
#
# The recorded TCP reference point is NOT the same physical point across all 257 franka
# roots -- the measured tcp-offset-in-tip-frame is strictly BIMODAL: 241 roots at
# z = 0.095 m (these configs) and 16 at z = 0.145 m (the `_tcp145_` configs). Each mode is
# internally constant to <1e-08 m. Mixing them injects a 50 mm systematic step into the eef
# slot that `ToRelativeAction` does NOT remove, because it is constant per root rather than
# per frame. Evidence: out/internData_a1_native_v30_fk_consistency_full_20260903.json.
#
# The partition is EMPIRICAL, by measured offset. There is no naming rule -- only 9 of the
# 16 outliers are `*_language` tasks and they span three task groups. Do not try to
# re-derive it from repo_id names.
#
# Position agreement with the official Franka URDF chain panda_link0 -> panda_link8 is
# 2-5e-08 m. The recorded orientation differs from FK by a constant 45 deg about -Z.
#
# Source: /path/to/raw/dataset
# (native LeRobot v3 staging of the official `sim_updated_lerobotv30` archives; 286/286
# staged, 1,488 roots total. Provenance + sidecar-uniformity table in
# /pfs/unified_actions/docs/records/claude_handoff_sim_updated_native_v30_2026_08_27.md)
#
# WHY THIS PROFILE IS SPLIT ACROSS TASK GROUPS: `root / repo_id` is joined by
# LeRobotDataset, and huggingface's validate_repo_id rejects a repo_id with more than two
# path segments. The corpus nests as <task_group>/<embodiment>/<task>[/<object>], so the
# root has to absorb <task_group>/<embodiment> for the repo_ids to be legal. That is the
# only reason there is one config per task group rather than one per profile.
#
# Two things this config does NOT claim:
#   * Every root carries `readiness.training_allowlist = false` in its
#     meta/unified_actions.json. Geometry (L1) is certified; causal action (L2) and camera
#     (L3) are not. Do not read this config's existence as a training gate.
#   * `actions.*` is a known LEFT-SHIFTED COPY of achieved state, not a controller command
#     -- measured at 1e-06 tolerance on 12 roots of this profile
#     (out/internData_a1_native_v30_master_timing_20260831.json). `ToRelativeAction`
#     therefore yields "delta to the next achieved pose": a valid world-model transition
#     target, NOT policy supervision. This is exactly what interndata_a1_genie1_sim.yaml
#     already does with the same columns.
#
# eef slots come from `*tcp_to_robot_pose` (grasp point in the robot root frame), not
# `*ee_to_robot_pose`, matching genie1: TCP is where contact happens. Quaternions in this
# corpus are wxyz; GetStateInternDataA1Genie1 reorders them to the slots' xyzw.
train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      images.rgb.head: img_1
      images.rgb.hand: img_2
      states.tcp_to_robot_pose: eef_state
      states.gripper.position: grip_state
      actions.tcp_to_robot_pose: eef_action
      actions.gripper.position: grip_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
  # franka is single-arm and records only head + hand, but the model takes
  # num_views=3. lift2/split_aloha map hand_left -> img_2 and hand_right -> img_3,
  # so the one hand camera fills the second wrist slot too. Without this the
  # collated `videos` has a view dim of 2 and wan_video.py's
  # `latents[:, :, :, 0:1] = z` fails: expected size 3, got 2.
  - type: FillMissingViews
    source: img_2
    keys: [img_3]
    mode: repeat
  - type: GetStateInternDataA1Genie1
    state_len: ${num_frames}
    key_mapper:
      - ("eef_state", "grip_state", None, None): state
  - type: GetActionInternDataA1Genie1
    action_len: ${action_len}
    key_mapper:
      - ("eef_action", "grip_action", None, None): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the tabletop manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the tabletop manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      images.rgb.head: img_1
      images.rgb.hand: img_2
      states.tcp_to_robot_pose: eef_state
      states.gripper.position: grip_state
      actions.tcp_to_robot_pose: eef_action
      actions.gripper.position: grip_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
  # franka is single-arm and records only head + hand, but the model takes
  # num_views=3. lift2/split_aloha map hand_left -> img_2 and hand_right -> img_3,
  # so the one hand camera fills the second wrist slot too. Without this the
  # collated `videos` has a view dim of 2 and wan_video.py's
  # `latents[:, :, :, 0:1] = z` fails: expected size 3, got 2.
  - type: FillMissingViews
    source: img_2
    keys: [img_3]
    mode: repeat
  - type: GetStateInternDataA1Genie1
    state_len: ${num_frames}
    key_mapper:
      - ("eef_state", "grip_state", None, None): state
  - type: GetActionInternDataA1Genie1
    action_len: ${action_len}
    key_mapper:
      - ("eef_action", "grip_action", None, None): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the tabletop manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the tabletop manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
dataset:
  type: OpenLeRobotMixedDatasetV3
  root: /path/to/root/dir
  train_pipeline: ${..train_pipeline}
  valid_pipeline: ${..valid_pipeline}
  repo_ids:
    - "close_the_electriccooker"
    - "close_the_laptop"
    - "close_the_microwave_part1"
    - "close_the_microwave_part2"
    - "close_the_pot"
    - "close_the_trashcan"
    - "close_the_washingmachine_left"
    - "close_the_washingmachine_right"
    - "open_the_laptop"
    - "open_the_microwave_part1"
    - "open_the_microwave_part2"
    - "open_the_pot"
    - "open_the_trashcan"
  action_sources:
    - actions.tcp_to_robot_pose
    - actions.gripper.position
  fps: ${fps}
