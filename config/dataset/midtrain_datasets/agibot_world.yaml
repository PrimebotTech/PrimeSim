train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.head: img_1
      observation.images.hand_left: img_2
      observation.images.hand_right: img_3
      observation.states.end.position: eef_pos_state
      observation.states.end.orientation: eef_quat_state
      observation.states.effector.position: grip_state
      observation.states.head.position: head_state
      observation.states.waist.position: waist_state
      observation.states.robot.position: chassis_pos_state
      observation.states.robot.orientation: chassis_quat_state
      actions.end.position: eef_pos_action
      actions.end.orientation: eef_quat_action
      actions.effector.position: grip_action
      actions.head.position: head_action
      actions.waist.position: waist_action
      actions.robot.velocity: chassis_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateAgiBotWorld
    state_len: ${num_frames}
    key_mapper:
      - ("eef_pos_state", "eef_quat_state", "head_state", "waist_state", "grip_state"): state
  - type: GetActionAgiBotWorld
    action_len: ${action_len}
    key_mapper:
      - ("eef_pos_action", "eef_quat_action", "head_action", "waist_action", "chassis_action", "grip_action"): ("action", "action_mask")
    slot_cols:
      chassis: [0, 2]
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]

