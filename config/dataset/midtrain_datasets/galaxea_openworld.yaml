dataset:
  type: OpenLeRobotMixedDatasetV3
  root: /path/to/root/dir
  train_pipeline: ${..train_pipeline}
  valid_pipeline: ${..valid_pipeline}
  action_sources:
    - action.left_gripper
    - action.right_gripper
    - action.chassis.velocities
  # Galaxea OpenWorld is recorded at 15 Hz; 15/10 is not an integer, so a 10 fps
  # delta_timestamp grid would miss every odd frame by 33 ms and lerobot's 1e-4
  # tolerance check raises. Keeps its native rate, as rt1.yaml and droid.yaml do:
  # 33 frames spanning 2.13s here against 3.2s elsewhere. Frame COUNT is what has
  # to match across datasets for a batch to collate, not the span.
  fps: 15
