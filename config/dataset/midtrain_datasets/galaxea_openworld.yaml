train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.head_rgb: img_1
      observation.images.left_wrist_rgb: img_2
      observation.images.right_wrist_rgb: img_3
      observation.state.left_ee_pose: left_ee_pose_state
      observation.state.right_ee_pose: right_ee_pose_state
      observation.state.left_gripper: left_grip_state
      observation.state.right_gripper: right_grip_state
      observation.state.torso: torso_state
      action.left_gripper: left_grip_action
      action.right_gripper: right_grip_action
      observation.state.chassis.velocities: chassis_vel_state
      action.chassis.velocities: chassis_vel_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateGalaxeaOpenWorld
    state_len: ${num_frames}
    key_mapper:
      - ("left_ee_pose_state", "right_ee_pose_state", "left_grip_state", "right_grip_state", "torso_state", "chassis_vel_state"): state
  - type: GetActionGalaxeaOpenWorld
    action_len: ${action_len}
    # The eef action is the ACHIEVED pose one frame ahead, read out of the state
    # columns (which span the whole frame window), not action.endpos. That column is
    # URDF FK of the commanded joints, which on ~4% of episode-arms (43 of 215 roots)
    # sits 40 mm to >25 cm off the achieved pose -- commanded vs achieved joints
    # differ by tens of degrees there (corr 0.955 with the eef gap) -- and on
    # Use_Of_Objects_20250704_003 is also measured at a different link (arm_link6 vs
    # the state's gripper_link, 81.7 mm apart). Using the state column for both ends
    # keeps the relative action on one tip and on the motion the video shows.
    row_offsets:
      left_ee_pose_state: 1
      right_ee_pose_state: 1
    key_mapper:
      - ("left_ee_pose_state", "right_ee_pose_state", "left_grip_action", "right_grip_action", None, "chassis_vel_action"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the household manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the household manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
