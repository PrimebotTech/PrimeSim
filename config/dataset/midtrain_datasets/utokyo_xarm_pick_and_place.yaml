train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.image: img_1
      observation.images.hand_image: img_2
      observation.images.image2: img_3
      observation.state: state_vec
      action: action_vec
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateUTokyoXArm
    state_len: ${num_frames}
    key_mapper:
      - ("state_vec"): state
  - type: GetActionUTokyoXArm
    action_len: ${action_len}
    pad_key: action_is_pad
    key_mapper:
      - ("action_vec"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Pick up the object and place it.
  - type: TransformPrompt
    default_prompt: Pick up the object and place it.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.image: img_1
      observation.images.hand_image: img_2
      observation.images.image2: img_3
      observation.state: state_vec
      action: action_vec
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateUTokyoXArm
    state_len: ${num_frames}
    key_mapper:
      - ("state_vec"): state
  - type: GetActionUTokyoXArm
    action_len: ${action_len}
    pad_key: action_is_pad
    key_mapper:
      - ("action_vec"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Pick up the object and place it.
  - type: TransformPrompt
    default_prompt: Pick up the object and place it.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
dataset:
  type: OpenLeRobotMixedDatasetV3
  root: /path/to/root/dir
  train_pipeline: ${..train_pipeline}
  valid_pipeline: ${..valid_pipeline}
  repo_ids:
    - utokyo_xarm_pick_and_place
  # The state's xyz + rpy and the action's absolute target pose are separate columns,
  # so the action gets its own window rather than being read off the state.
  action_sources:
    - action
  action_from_state: false
