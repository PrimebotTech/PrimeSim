train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.top_head: img_1
      observation.images.hand_left: img_2
      observation.images.hand_right: img_3
      observation.state: state_vector
      action: action_vector
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateAgiBotWorld2026
    state_len: ${num_frames}
    key_mapper:
      - state_vector: state
    source_cols: &state_cols
      left_eef:      [58, 59, 60, 50, 51, 52, 53]
      left_gripper:  [0]
      right_eef:     [61, 62, 63, 54, 55, 56, 57]
      right_gripper: [1]
      head:          [106, 107, 108]
      waist:         [109, 110, 111, 112, 113]
  - type: GetActionAgiBotWorld2026
    action_len: ${action_len}
    key_mapper:
      - action_vector: ("action", "action_mask")
    source_cols: &action_cols
      left_eef:      [2, 3, 4, 8, 9, 10, 11]
      left_gripper:  [0]
      right_eef:     [5, 6, 7, 12, 13, 14, 15]
      right_gripper: [1]
      head:          [30, 31, 32]
      waist:         [33, 34, 35, 36, 37]
      chassis:       [38, 39, 43]
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]

valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.top_head: img_1
      observation.images.hand_left: img_2
      observation.images.hand_right: img_3
      observation.state: state_vector
      action: action_vector
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateAgiBotWorld2026
    state_len: ${num_frames}
    key_mapper:
      - state_vector: state
    source_cols: *state_cols
  - type: GetActionAgiBotWorld2026
    action_len: ${action_len}
    key_mapper:
      - action_vector: ("action", "action_mask")
    source_cols: *action_cols
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]

dataset:
  type: OpenLeRobotMixedDatasetV3
  root: /path/to/root/dir
  train_pipeline: ${..train_pipeline}
  valid_pipeline: ${..valid_pipeline}
  action_sources:
    - action
  action_from_state: false
  fps: ${fps}
  repo_ids:
