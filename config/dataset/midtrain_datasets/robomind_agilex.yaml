dataset:
  type: OpenLeRobotMixedDatasetV3
  root: /path/to/root/dir
  train_pipeline: ${..train_pipeline}
  valid_pipeline: ${..valid_pipeline}
  repo_ids:
    - agilex_h5
  action_sources:
    - actions.master.end_effector_left_pose_fk.data
    - actions.master.end_effector_left_position_align.data
    - actions.master.end_effector_right_pose_fk.data
    - actions.master.end_effector_right_position_align.data
  fps: ${fps}
