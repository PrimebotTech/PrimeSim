train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.image_0: img_1
      observation.state: state_vec
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
  - type: FillMissingViews
    source: img_1
    keys: [img_2, img_3]
    mode: repeat
  - type: GetStateBridge
    state_len: ${num_frames}
    key_mapper:
      - ("state_vec"): state
  - type: GetActionBridge
    state_len: 1
    action_len: ${action_len}
    pad_key: observation.state_is_pad
    key_mapper:
      - ("state_vec"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the tabletop manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the tabletop manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.image_0: img_1
      observation.state: state_vec
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
  - type: FillMissingViews
    source: img_1
    keys: [img_2, img_3]
    mode: repeat
  - type: GetStateBridge
    state_len: ${num_frames}
    key_mapper:
      - ("state_vec"): state
  - type: GetActionBridge
    state_len: 1
    action_len: ${action_len}
    pad_key: observation.state_is_pad
    key_mapper:
      - ("state_vec"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the tabletop manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the tabletop manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
dataset:
  type: OpenLeRobotMixedDatasetV3
  root: /path/to/root/dir
  train_pipeline: ${..train_pipeline}
  valid_pipeline: ${..valid_pipeline}
  repo_ids:
    - bridge_lerobot_v30
  action_sources:
    - observation.state
  action_from_state: true
  # Bridge V2 is recorded at 5 Hz, below the global 10 fps: a 10 fps grid asks for
  # frames that do not exist (5/10 is not an integer) and lerobot's 1e-4 tolerance
  # check raises rather than duplicating. Keeps its native rate, as rt1.yaml and
  # droid.yaml do: 33 frames spanning 6.4s here against 3.2s elsewhere. Frame COUNT
  # is what has to match across datasets for a batch to collate, not the span.
  fps: 5
