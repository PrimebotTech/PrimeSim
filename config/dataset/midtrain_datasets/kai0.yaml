train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.top_head: img_1
      observation.images.hand_left: img_2
      observation.images.hand_right: img_3
      observation.eef_pose: eef_state
      action.eef_pose: eef_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateKai0
    state_len: ${num_frames}
    key_mapper:
      - ("eef_state"): state
  - type: GetActionKai0
    action_len: ${action_len}
    key_mapper:
      - ("eef_action"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.top_head: img_1
      observation.images.hand_left: img_2
      observation.images.hand_right: img_3
      observation.eef_pose: eef_state
      action.eef_pose: eef_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateKai0
    state_len: ${num_frames}
    key_mapper:
      - ("eef_state"): state
  - type: GetActionKai0
    action_len: ${action_len}
    key_mapper:
      - ("eef_action"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
dataset:
  type: OpenLeRobotMixedDatasetV3
  root: /path/to/root/dir
  train_pipeline: ${..train_pipeline}
  valid_pipeline: ${..valid_pipeline}
  action_sources:
    - action.eef_pose
  action_from_state: false
  fps: ${fps}
  repo_ids:
    - kai0_task_a_base
    - kai0_task_b_base
    - kai0_task_c_base
