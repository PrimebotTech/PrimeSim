train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.cam_high: img_1
      observation.images.cam_left_wrist: img_2
      observation.images.cam_right_wrist: img_3
      observation.state: state_vec
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateHyEmbodied
    state_len: ${num_frames}
    key_mapper:
      - state_vec: state
  - type: GetActionHyEmbodied
    state_len: 1
    action_len: ${action_len}
    pad_key: observation.state_is_pad
    key_mapper:
      - state_vec: ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the tabletop manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the tabletop manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.cam_high: img_1
      observation.images.cam_left_wrist: img_2
      observation.images.cam_right_wrist: img_3
      observation.state: state_vec
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateHyEmbodied
    state_len: ${num_frames}
    key_mapper:
      - state_vec: state
  - type: GetActionHyEmbodied
    state_len: 1
    action_len: ${action_len}
    pad_key: observation.state_is_pad
    key_mapper:
      - state_vec: ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the tabletop manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the tabletop manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
