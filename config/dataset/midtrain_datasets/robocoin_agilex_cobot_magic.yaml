train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.cam_head_rgb: img_1
      observation.images.cam_left_wrist_rgb: img_2
      observation.images.cam_right_wrist_rgb: img_3
      eef_sim_pose_state: eef_pose_state
      eef_sim_pose_action: eef_pose_action
      gripper_open_scale_state: grip_state
      gripper_open_scale_action: grip_action
      observation.state: state
      action: action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetActionRoboCoin
    action_len: ${action_len}
    key_mapper:
      - ("eef_pose_action", "action", "grip_action"): ("action", "action_mask")
    left_pos: [0, 1, 2]
    left_euler: [3, 4, 5]
    left_grip: 0
    right_pos: [6, 7, 8]
    right_euler: [9, 10, 11]
    right_grip: 1
  - type: GetStateRoboCoin
    state_len: ${num_frames}
    key_mapper:
      - ("eef_pose_state", "state", "grip_state"): state
    left_pos: [0, 1, 2]
    left_euler: [3, 4, 5]
    left_grip: 0
    right_pos: [6, 7, 8]
    right_euler: [9, 10, 11]
    right_grip: 1
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
