train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.robot0_agentview_left: img_1
      observation.images.robot0_eye_in_hand: img_2
      observation.images.robot0_agentview_right: img_3
      observation.state: state_vector
      action: action_vector
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateRobocasa
    state_len: ${num_frames}
    key_mapper:
      - state_vector: state
  - type: GetActionRobocasa
    action_len: ${action_len}
    # row OFFSET into the shared frame window: frames 1..action_len
    state_len: 1
    key_mapper:
      - ("state_vector", "action_vector"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the kitchen manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the kitchen manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.robot0_agentview_left: img_1
      observation.images.robot0_eye_in_hand: img_2
      observation.images.robot0_agentview_right: img_3
      observation.state: state_vector
      action: action_vector
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateRobocasa
    state_len: ${num_frames}
    key_mapper:
      - state_vector: state
  - type: GetActionRobocasa
    action_len: ${action_len}
    # row OFFSET into the shared frame window: frames 1..action_len
    state_len: 1
    key_mapper:
      - ("state_vector", "action_vector"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the kitchen manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the kitchen manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]
