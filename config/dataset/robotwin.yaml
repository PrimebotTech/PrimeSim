# @package _global_

# robotwin on its own. The pipeline is inline here rather than pulled from
# midtrain_datasets/, so this file is a complete worked example: copy it, swap the
# transforms for your robot, and you have a dataset config.

# See docs/adapting_a_dataset.md.

train_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.cam_head: img_1
      observation.images.cam_left_wrist: img_2
      observation.images.cam_right_wrist: img_3
      observation.state: state_vec
      observation.ee_pose: eef_state
      action: action_vec
      action.ee_pose: eef_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateRobomind
    state_len: ${num_frames}
    source_cols:
      left_eef: [0, 1, 2, 3, 4, 5, 6]
      left_gripper: [6]
      right_eef: [7, 8, 9, 10, 11, 12, 13]
      right_gripper: [13]
    key_mapper:
      - ("eef_state", "state_vec", "eef_state", "state_vec"): state
  - type: GetActionRobomind
    action_len: ${action_len}
    source_cols:
      left_eef: [0, 1, 2, 3, 4, 5, 6]
      left_gripper: [6]
      right_eef: [7, 8, 9, 10, 11, 12, 13]
      right_gripper: [13]
    key_mapper:
      - ("eef_action", "action_vec", "eef_action", "action_vec"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]

valid_pipeline:
  - type: RefactorLerobot
    key_mapper:
      observation.images.cam_head: img_1
      observation.images.cam_left_wrist: img_2
      observation.images.cam_right_wrist: img_3
      observation.state: state_vec
      observation.ee_pose: eef_state
      action: action_vec
      action.ee_pose: eef_action
  - type: AlignFormatLerobot
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: GetStateRobomind
    state_len: ${num_frames}
    source_cols:
      left_eef: [0, 1, 2, 3, 4, 5, 6]
      left_gripper: [6]
      right_eef: [7, 8, 9, 10, 11, 12, 13]
      right_gripper: [13]
    key_mapper:
      - ("eef_state", "state_vec", "eef_state", "state_vec"): state
  - type: GetActionRobomind
    action_len: ${action_len}
    source_cols:
      left_eef: [0, 1, 2, 3, 4, 5, 6]
      left_gripper: [6]
      right_eef: [7, 8, 9, 10, 11, 12, 13]
      right_gripper: [13]
    key_mapper:
      - ("eef_action", "action_vec", "eef_action", "action_vec"): ("action", "action_mask")
  - type: ToRelativeAction
    key_mapper:
      - ("action", "state", "action_mask"): action
  - type: GetTextLerobot
    default_text: Complete the bimanual manipulation task.
  - type: TransformPrompt
    default_prompt: Complete the bimanual manipulation task.
    key_mapper:
      - text: prompt
  - type: ResizeImages
    height: ${img_height}
    width: ${img_width}
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ImgNormalize
    key_mapper:
      img_1: img_1
      img_2: img_2
      img_3: img_3
  - type: ConcatenateMultiview
    key_mapper:
      - ("img_1", "img_2", "img_3"): videos
  - type: Gather
    keys: [
      videos,
      state, action, action_mask,
      prompt,
    ]


